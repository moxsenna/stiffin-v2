name: CI Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare B1 Test Database (owner migrations + runtime grants)
        run: sh scripts/ci-setup-db.sh

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Domain & Unit Tests
        run: pnpm test

      - name: Run PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgresql://promotor_runtime:ci_runtime_pw@localhost:5432/postgres
          OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @promotor/platform-api test:integration

      - name: Verify PromotorClass Production Build
        run: pnpm build:class

      - name: Verify PromotorFlow Production Build
        run: pnpm build:flow

      - name: Verify Platform API Worker Bundle
        run: pnpm build:api

      - name: Verify PromotorClass OpenNext CF Build
        run: pnpm --filter @promotor/promotor-class-web exec opennextjs-cloudflare build

      - name: Verify PromotorFlow OpenNext CF Build
        run: pnpm --filter @promotor/promotor-flow-web exec opennextjs-cloudflare build

      - name: Install Playwright Chromium Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Browser E2E Tests
        run: pnpm test:e2e
