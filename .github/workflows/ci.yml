name: CI Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare B1 Test Database (owner migrations + runtime grants)
        run: sh scripts/ci-setup-db.sh

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Domain & Integration Tests
        run: pnpm test

      - name: Run B1 Shared Core PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgresql://promotor_runtime:ci_runtime_pw@localhost:5432/postgres
          OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @promotor/platform-api test:integration

      - name: Verify PromotorClass Production Build
        run: pnpm build:class

      - name: Verify PromotorFlow Production Build
        run: pnpm build:flow

      - name: Verify Platform API Worker Bundle
        run: pnpm build:api

  deploy-class:
    name: Deploy PromotorClass to Cloudflare Workers
    needs: verify
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Log Deployment GITHUB_SHA
        run: echo "Deploying PromotorClass from GITHUB_SHA=${{ github.sha }}"

      - name: Deploy PromotorClass to Cloudflare Workers
        run: pnpm deploy:class:cf

  deploy-api:
    name: Deploy stiffin-promotor-api to Cloudflare Workers
    needs: verify
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Log Deployment GITHUB_SHA
        run: echo "Deploying stiffin-promotor-api from GITHUB_SHA=${{ github.sha }}"

      - name: Deploy stiffin-promotor-api to Cloudflare Workers
        run: pnpm deploy:api:cf
