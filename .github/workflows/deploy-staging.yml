name: Manual Staging Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy to Staging'
        required: true
        type: choice
        options:
          - all
          - promotor-class
          - promotor-flow
          - platform-api
        default: 'all'

jobs:
  verify:
    name: Pre-deployment Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare B1 Test Database (owner migrations + runtime grants)
        run: sh scripts/ci-setup-db.sh

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Domain & Integration Tests
        run: pnpm test

      - name: Run B1 Shared Core PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgresql://promotor_runtime:ci_runtime_pw@localhost:5432/postgres
          OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @promotor/platform-api test:integration

      - name: Verify PromotorClass Production Build
        run: pnpm build:class

      - name: Verify PromotorFlow Production Build
        run: pnpm build:flow

      - name: Verify Platform API Worker Bundle
        run: pnpm build:api

  deploy-api-staging:
    name: Deploy stiffin-promotor-api-staging to Cloudflare Workers
    needs: verify
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'platform-api' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Log Deployment GITHUB_SHA
        run: echo "Deploying stiffin-promotor-api-staging from GITHUB_SHA=${{ github.sha }}"

      - name: Deploy stiffin-promotor-api-staging to Cloudflare Workers
        run: pnpm deploy:api:staging:cf

      - name: Output Staging API URL
        run: |
          echo "Platform API Staging Worker: stiffin-promotor-api-staging"
          echo "Platform API Staging URL: https://stiffin-promotor-api-staging.moxsenna.workers.dev"

  deploy-class-staging:
    name: Deploy promotor-class-staging to Cloudflare Workers
    needs: [verify, deploy-api-staging]
    if: ${{ always() && (needs.verify.result == 'success') && (github.event.inputs.target == 'all' || github.event.inputs.target == 'promotor-class') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Log Deployment GITHUB_SHA
        run: echo "Deploying promotor-class-staging from GITHUB_SHA=${{ github.sha }}"

      - name: Deploy promotor-class-staging to Cloudflare Workers
        run: pnpm deploy:class:staging:cf

      - name: Output Staging Class URL
        run: |
          echo "PromotorClass Staging Worker: promotor-class-staging"
          echo "PromotorClass Staging URL: https://promotor-class-staging.moxsenna.workers.dev"

  deploy-flow-staging:
    name: Deploy promotor-flow-staging to Cloudflare Workers
    needs: [verify, deploy-api-staging]
    if: ${{ always() && (needs.verify.result == 'success') && (github.event.inputs.target == 'all' || github.event.inputs.target == 'promotor-flow') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Log Deployment GITHUB_SHA
        run: echo "Deploying promotor-flow-staging from GITHUB_SHA=${{ github.sha }}"

      - name: Deploy promotor-flow-staging to Cloudflare Workers
        run: pnpm deploy:flow:staging:cf

      - name: Output Staging Flow URL
        run: |
          echo "PromotorFlow Staging Worker: promotor-flow-staging"
          echo "PromotorFlow Staging URL: https://promotor-flow-staging.moxsenna.workers.dev"
