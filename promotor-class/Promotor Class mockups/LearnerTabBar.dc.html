<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #E5E5E1;background:#FFFFFF;padding:6px 8px calc(6px + env(safe-area-inset-bottom, 12px))">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:52px;padding:4px 2px;color:{{ cBelajar }};cursor:pointer" style-active="background:#F7F7F5">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wBelajar }}" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5C10.6 6.2 8.7 5.5 6 5.5H3.5v12H6c2.7 0 4.6.7 6 2"></path><path d="M12 7.5c1.4-1.3 3.3-2 6-2h2.5v12H18c-2.7 0-4.6.7-6 2"></path><path d="M12 7.5v14"></path></svg>
    <span style="font-size:11.5px;line-height:1;font-weight:{{ fBelajar }}">Belajar</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:52px;padding:4px 2px;color:{{ cProgram }};cursor:pointer" style-active="background:#F7F7F5">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wProgram }}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"></path><path d="M4 12h16"></path><path d="M4 17.5h10"></path></svg>
    <span style="font-size:11.5px;line-height:1;font-weight:{{ fProgram }}">Program saya</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:52px;padding:4px 2px;color:{{ cAkun }};cursor:pointer" style-active="background:#F7F7F5">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wAkun }}" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.4"></circle><path d="M5 19.5c0-3.2 3.1-5.2 7-5.2s7 2 7 5.2"></path></svg>
    <span style="font-size:11.5px;line-height:1;font-weight:{{ fAkun }}">Akun</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Belajar&quot;,&quot;Program&quot;,&quot;Akun&quot;],&quot;default&quot;:&quot;Belajar&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'Belajar';
    const v = {};
    ['Belajar', 'Program', 'Akun'].forEach(key => {
      const on = a === key;
      v['c' + key] = on ? '#20211F' : '#9A9C97';
      v['w' + key] = on ? 2 : 1.5;
      v['f' + key] = on ? 500 : 400;
    });
    return v;
  }
}

</script>
</body>
</html>
