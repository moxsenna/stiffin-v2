<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #D7D8D3;background:#F7F7F5;padding:6px 4px calc(6px + env(safe-area-inset-bottom, 12px))">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:4px 2px;color:{{ cHome }};cursor:pointer" style-active="background:#EDEDE9">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wHome }}" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3.5l9 6.7V20a1 1 0 0 1-1 1h-4.5v-6h-7v6H4a1 1 0 0 1-1-1z"></path></svg>
    <span style="font-size:11px;line-height:1;font-weight:{{ fHome }}">Beranda</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:4px 2px;color:{{ cProgram }};cursor:pointer" style-active="background:#EDEDE9">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wProgram }}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v13H5.5A1.5 1.5 0 0 0 4 18.5z"></path><path d="M4 18.5A1.5 1.5 0 0 0 5.5 20H19"></path><path d="M8.5 8.5h6"></path></svg>
    <span style="font-size:11px;line-height:1;font-weight:{{ fProgram }}">Program</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:4px 2px;color:{{ cPeserta }};cursor:pointer" style-active="background:#EDEDE9">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wPeserta }}" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8.5" r="3.2"></circle><path d="M3.5 19.5c0-3 2.7-4.8 6-4.8s6 1.8 6 4.8"></path><path d="M16.5 6.6a3.2 3.2 0 0 1 0 6.1"></path><path d="M18 15.2c1.7.6 2.9 1.9 2.9 4.3"></path></svg>
    <span style="font-size:11px;line-height:1;font-weight:{{ fPeserta }}">Peserta</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:4px 2px;color:{{ cAktivitas }};cursor:pointer" style-active="background:#EDEDE9">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wAktivitas }}" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6.5 5 13L17 12h4"></path></svg>
    <span style="font-size:11px;line-height:1;font-weight:{{ fAktivitas }}">Aktivitas</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:4px 2px;color:{{ cLainnya }};cursor:pointer" style-active="background:#EDEDE9">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ wLainnya }}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>
    <span style="font-size:11px;line-height:1;font-weight:{{ fLainnya }}">Lainnya</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Beranda&quot;,&quot;Program&quot;,&quot;Peserta&quot;,&quot;Aktivitas&quot;,&quot;Lainnya&quot;],&quot;default&quot;:&quot;Beranda&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'Beranda';
    const v = {};
    ['Home:Beranda', 'Program:Program', 'Peserta:Peserta', 'Aktivitas:Aktivitas', 'Lainnya:Lainnya'].forEach(pair => {
      const [key, label] = pair.split(':');
      const on = a === label;
      v['c' + key] = on ? '#167A68' : '#73756F';
      v['w' + key] = on ? 2.1 : 1.6;
      v['f' + key] = on ? 500 : 400;
    });
    return v;
  }
}

</script>
</body>
</html>
