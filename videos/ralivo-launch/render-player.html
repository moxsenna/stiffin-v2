<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ralivo Launch Video — Render Player</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000000;
      font-family: 'Archivo', sans-serif;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #ffffff;
    }
    .scene-container {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="el-01-hook" class="scene-container" data-id="01-hook" data-src="compositions/frames/01-hook.html" data-start="0" data-duration="4.5"></div>
    <div id="el-02-problem" class="scene-container" data-id="02-problem" data-src="compositions/frames/02-problem.html" data-start="4" data-duration="4.6"></div>
    <div id="el-03-solution" class="scene-container" data-id="03-solution" data-src="compositions/frames/03-solution.html" data-start="8" data-duration="5.5"></div>
    <div id="el-04-classroom-checkout" class="scene-container" data-id="04-classroom-checkout" data-src="compositions/frames/04-classroom-checkout.html" data-start="13" data-duration="5.5"></div>
    <div id="el-05-flow-booking" class="scene-container" data-id="05-flow-booking" data-src="compositions/frames/05-flow-booking.html" data-start="18" data-duration="5.5"></div>
    <div id="el-06-proof" class="scene-container" data-id="06-proof" data-src="compositions/frames/06-proof.html" data-start="23" data-duration="4.5"></div>
    <div id="el-07-cta" class="scene-container" data-id="07-cta" data-src="compositions/frames/07-cta.html" data-start="27" data-duration="3"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    window.scenes = [];

    // Master transitions timeline
    const mainTl = gsap.timeline({ paused: true });
    window.__timelines["main"] = mainTl;

    mainTl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.0);
    mainTl.fromTo("#el-02-problem", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.0);
    mainTl.to("#el-02-problem", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 8.0);
    mainTl.fromTo("#el-03-solution", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 8.0);
    mainTl.to("#el-03-solution", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13.0);
    mainTl.fromTo("#el-04-classroom-checkout", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13.0);
    mainTl.to("#el-04-classroom-checkout", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18.0);
    mainTl.fromTo("#el-05-flow-booking", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18.0);
    mainTl.to("#el-05-flow-booking", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23.0);
    mainTl.fromTo("#el-06-proof", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23.0);
    mainTl.to("#el-06-proof", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27.0);
    mainTl.fromTo("#el-07-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27.0);
    mainTl.to({}, { duration: 30.0 }, 0);

    async function loadAllScenes() {
      const containerElements = document.querySelectorAll('.scene-container');
      for (const el of containerElements) {
        const id = el.getAttribute('data-id');
        const src = el.getAttribute('data-src');
        const start = parseFloat(el.getAttribute('data-start'));
        const duration = parseFloat(el.getAttribute('data-duration'));

        const res = await fetch(src);
        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const template = doc.querySelector('template');
        if (!template) {
          throw new Error('Template not found in ' + src);
        }

        const clone = template.content.cloneNode(true);
        const styles = clone.querySelectorAll('style');
        styles.forEach(s => document.head.appendChild(s));

        const scripts = clone.querySelectorAll('script');
        // Remove scripts from clone before inserting into DOM to control execution
        scripts.forEach(s => s.remove());

        el.appendChild(clone);

        // Execute frame scripts
        for (const s of scripts) {
          if (s.src) {
            // Already loaded GSAP globally
            continue;
          }
          const fn = new Function(s.textContent);
          fn();
        }

        window.scenes.push({
          id,
          el,
          start,
          duration,
          end: start + duration
        });
      }

      await document.fonts.ready;
      return true;
    }

    window.verifyReady = async function() {
      await loadAllScenes();
      window.seekFrame(0);
      return true;
    };

    window.seekFrame = function(frameIndex) {
      const fps = 30;
      const t = frameIndex / fps;

      mainTl.seek(t);

      for (const scene of window.scenes) {
        if (t >= scene.start && t <= scene.end) {
          scene.el.style.visibility = 'visible';
          const localT = t - scene.start;
          if (window.__timelines[scene.id]) {
            window.__timelines[scene.id].seek(localT);
          }
        } else {
          scene.el.style.visibility = 'hidden';
        }
      }

      return { frame: frameIndex, time: t };
    };
  </script>
</body>
</html>
